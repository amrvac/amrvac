name: tests

on:
  push:
    branches: [ master, amrvac3.3 ]
  pull_request:
    branches: [ master, amrvac3.3 ]


jobs:
  COMPILE:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        compiler: [gfortran-11, gfortran-12, gfortran-13, gfortran-14]
        include:
          - os: macos-latest
            compiler: gfortran-15


    env:
      FC: ${{ matrix.compiler }}
      AMRVAC_DIR: ${GITHUB_WORKSPACE}
      OSX_GCC_PACKAGE_NAME: gcc@15

    runs-on: ${{ matrix.os }}

    name: compile / ${{ matrix.os }} / ${{ matrix.compiler }}

    steps:
      - uses: actions/checkout@v6
      - name: install dependencies
        run: |
          if [[ $RUNNER_OS == "Linux" ]]; then
            sudo apt-get update
            sudo apt-get install ${{ matrix.compiler }}
            sudo apt-get install openmpi-bin libopenmpi-dev
          else
            brew install ${{ env.OSX_GCC_PACKAGE_NAME }}
            brew install open-mpi
            ln -s $(which ${{ matrix.compiler }}) /usr/local/bin/gfortran
            export PATH=$PATH:/usr/local/bin
          fi
      - name: check compiler versions
        run: |
          whereis ${FC}
          ${FC} --version
          gfortran --version
          mpirun --version
          mpif90 --version
      - name: check code dependencies
        run: |
          cd src
          bash update_dependencies.sh --verbose || exit 1
      - name: compile 1D
        run: |
          cd lib
          make 1d1 ARCH=debug -j 4 || exit 1
      - name: run 1D rho test
        run: |
          cd tests
          bash test_runner.sh rho/auto_1d


  GNU:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        FC_compiler: [gfortran-14]
        CC_compiler: [gcc-14]
        suite: [rho, nl, demo, hd, srhd, rhd, rmhd, ffhd, mhd, rd, ard, mg, twofl, mf]

    env:
      CC: ${{ matrix.CC_compiler }}
      FC: ${{ matrix.FC_compiler }}
      AMRVAC_DIR: ${GITHUB_WORKSPACE}

    runs-on: ${{ matrix.os }}
    needs: COMPILE

    name: ${{ matrix.suite }}

    steps:
      - uses: actions/checkout@v6
      - name: install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install openmpi-bin libopenmpi-dev
      - name: check compiler versions
        run: |
          ${FC} --version
          ${CC} --version
          mpirun --version
      - name: check code dependencies
        run: |
          cd src
          bash update_dependencies.sh --verbose || exit 1
      - name: compile
        run: |
          cd lib
          make clean
          make -j 2 || exit 1
      - name: run tests
        run: |
          cd tests
          bash test_runner.sh ${{ matrix.suite }}

  INTEL:
    runs-on: ubuntu-latest
    name: compile / Intel

    env:
      FC: ifx
      CC: icc
      AMRVAC_DIR: ${GITHUB_WORKSPACE}

    steps:
      - uses: actions/checkout@v6
      - name: setup for Intel oneAPI
        # see https://www.intel.com/content/www/us/en/developer/tools/oneapi/base-toolkit-download.html (APT instructions)
        # apt-key is no longer available on recent runners: store the key in its own keyring and reference it via signed-by
        run: |
          wget -O- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB \
            | gpg --dearmor | sudo tee /usr/share/keyrings/oneapi-archive-keyring.gpg > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" \
            | sudo tee /etc/apt/sources.list.d/oneAPI.list
      - name: install Intel oneAPI
        run: |
          sudo apt update 
          sudo apt-get -y upgrade 
          #sudo apt-get install intel-oneapi-compiler-dpcpp-cpp-and-cpp-classic
          #sudo apt-get install intel-oneapi-dpcpp-cpp
          sudo apt-get install intel-oneapi-compiler-fortran
          sudo apt-get install intel-oneapi-mpi
          sudo apt-get install intel-oneapi-mpi-devel
          source /opt/intel/oneapi/setvars.sh
          printenv >> $GITHUB_ENV
      - name: check compiler versions
        run: |
          ${FC} --version
          #${CC} --version
          mpirun --version
          mpiifx --version
      - name: check code dependencies
        run: |
          cd src
          bash update_dependencies.sh --verbose || exit 1
      - name: compile 1D
        run: |
          cd lib
          make 1d1 -j 4 ARCH=ifxdebug
      - name: compile 2D
        run: |
          cd lib
          make 2d2 -j 4 ARCH=ifxdebug
      - name: compile 3D
        run: |
          cd lib
          make 3d3 -j 4 ARCH=ifxdebug
