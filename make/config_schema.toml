# This file sets what settings in agile.par are read as compile
# time flags and whether they should affect the build hash.
# [components] is for hidden implied options inferred by the precompiler

[components]
[components.source_dt]
type = "flag"
name = "SOURCE_DT"
flags = ["fypp", "hash"]
default = false

[components.source_compact]
type = "flag"
name = "SOURCE_COMPACT"
flags = ["fypp", "hash"]
default = false
implies = ["components.source_dt"]

[components.source_nonlocal]
type = "flag"
name = "SOURCE_NONLOCAL"
flags = ["fypp", "hash"]
default = false
implies = ["components.source_dt"]

[components.source_local]
type = "flag"
name = "SOURCE_LOCAL"
flags = ["fypp", "hash"]
default = false
implies = ["components.source_dt"]

# Compile in fill_nwextra_device: after every grid change, re-derive the
# non-advected extra w-variables (nwextra) analytically from usr_set_nwextra
# over the whole of every block, ghost cells included. Implied by phys='ffhd',
# whose frozen field is exactly such a variable.
[components.fill_nwextra_analytic]
type = "flag"
name = "FILL_NWEXTRA_ANALYTIC"
flags = ["fypp", "hash"]
default = false

# Logarithmically stretched radial coordinate: the mesh is uniform in
# xi = ln(r) rather than in r itself. Implied by geometry='logSpherical' and
# geometry='logCylindrical', which emit GEOM='spherical'/'cylindrical' so that
# every existing #:if GEOM branch keeps applying - a log grid *is* spherical,
# only its radial spacing differs.
[components.log_radius]
type = "flag"
name = "LOG_RADIUS"
flags = ["fypp", "hash"]
default = false

[methodlist]
[methodlist.phys]
type = "option"
name = "PHYS"
options = ["hd", "mhd", "ffhd", "srhd", "srmhd"]
flags = ["fypp", "hash"]
default = "hd"
implies.ffhd = ["components.fill_nwextra_analytic"]

[methodlist.flux_adaptive_diffusion]
type = "flag"
name = "FLUX_AD"
flags = ["fypp", "hash"]
default = false

[boundlist]
[boundlist.specialboundary]
type = "flag"
name = "SPECIALBOUNDARY"
flags = ["fypp", "hash"]
default = false

[hd_list]
[hd_list.hd_gravity]
type = "flag"
name = "GRAVITY"
flags = ["fypp", "hash"]
default = false
implies = ["components.source_local"]

[hd_list.hd_n_tracer]
type = "value"
name = "N_TRACER"
dtype = "int"
flags = ["fypp", "hash"]

[hd_list.hd_radiative_cooling]
type = "flag"
name = "COOLING"
flags = ["fypp", "hash"]
default = false
implies = ["components.source_local"]

[hd_list.hd_source_usr]
type = "flag"
name = "SOURCE_USR"
flags = ["fypp", "hash"]
default = false
implies = ["components.source_local"]

[ffhd_list]
[ffhd_list.ffhd_pdivb]
type = "flag"
name = "PDIVB"
flags = ["fypp", "hash"]
default = false
implies = ["components.source_nonlocal"]

[ffhd_list.ffhd_hyperbolic_thermal_conduction]
type = "flag"
name = "HYPERTC"
flags = ["fypp", "hash"]
default = false
implies = ["components.source_nonlocal"]

[ffhd_list.ffhd_gravity]
type = "flag"
name = "GRAVITY"
flags = ["fypp", "hash"]
default = false
implies = ["components.source_local"]

[ffhd_list.ffhd_radiative_cooling]
type = "flag"
name = "COOLING"
flags = ["fypp", "hash"]
default = false
implies = ["components.source_local"]

[ffhd_list.ffhd_source_usr]
type = "flag"
name = "SOURCE_USR"
flags = ["fypp", "hash"]
default = false
implies = ["components.source_local"]

[mhd_list]
[mhd_list.mhd_gravity]
type = "flag"
name = "GRAVITY"
flags = ["fypp", "hash"]
default = false
implies = ["components.source_local"]

[mhd_list.mhd_n_tracer]
type = "value"
name = "N_TRACER"
dtype = "int"
flags = ["fypp", "hash"]

[mhd_list.mhd_source_usr]
type = "flag"
name = "SOURCE_USR"
flags = ["fypp", "hash"]
default = false
implies = ["components.source_local"]

[mhd_list.mhd_resistivity]
type = "flag"
name = "RESISTIVE"
flags = ["fypp", "hash"]
default = false
implies = ["components.source_compact"]

[mhd_list.mhd_radiative_cooling]
type = "flag"
name = "COOLING"
flags = ["fypp", "hash"]
default = false
implies = ["components.source_local"]

[mhd_list.mhd_hyperbolic_thermal_conduction]
type = "flag"
name = "HYPERTC"
flags = ["fypp", "hash"]
default = false
implies = ["components.source_compact"]

[mhd_list.mhd_hyperbolic_thermal_conduction_anisotropic]
type = "flag"
name = "HYPERTC_ANISO"
flags = ["fypp", "hash"]
default = false
