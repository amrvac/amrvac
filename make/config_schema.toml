[mhd_list.mhd_energy_only]
type = "flag"
name = "MHD_ENERGY_ONLY"
flags = ["fypp", "hash"]
default = false

[srhd_list]
[srhd_list.srhd_source_usr]
type = "flag"
name = "SOURCE_USR"
flags = ["fypp", "hash"]
default = false
implies = ["components.source_local"]

[srhd_list.srhd_n_tracer]
type = "value"
name = "N_TRACER"
dtype = "int"
flags = ["fypp", "hash"]

[srmhd_list]
[srmhd_list.srmhd_source_usr]
type = "flag"
name = "SOURCE_USR"
flags = ["fypp", "hash"]
default = false
implies = ["components.source_local"]

[srmhd_list.srmhd_n_tracer]
type = "value"
name = "N_TRACER"
dtype = "int"
flags = ["fypp", "hash"]



[meshlist]
[meshlist.refine_usr]
type = "flag"
name = "REFINE_USR"
flags = ["fypp", "hash"]
default = false

# 'logSpherical'/'logCylindrical' are the same coordinate systems with a
# logarithmically stretched radius, so they *emit* GEOM='spherical'/
# 'cylindrical' and additionally turn on LOG_RADIUS. Only the geometry kernel
# and the handful of sites listed there need to know the difference.
[meshlist.geometry]
type = "option"
name = "GEOM"
options = ["Cartesian", "spherical", "cylindrical", "logSpherical", "logCylindrical"]
flags = ["fypp", "hash"]
default = "Cartesian"
emit.logSpherical = "spherical"
emit.logCylindrical = "cylindrical"
implies.logSpherical = ["components.log_radius"]
implies.logCylindrical = ["components.log_radius"]
